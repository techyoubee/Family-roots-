# ---------------------------------------------------------------------------
# Family Roots - example Apache vhost (HTTPS)
#
# Replace:
#   family-roots.example.com   -> your domain
#   /var/www/family-roots      -> your project path
#   certificate paths          -> your certificate
#
# Requires: mod_rewrite, mod_ssl, mod_headers
# Note: the app only detects HTTPS via $_SERVER['HTTPS']; see the
#       SetEnvIf line near the bottom if TLS terminates at a proxy.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName family-roots.example.com

    # Send everything to HTTPS. Sessions and HSTS assume TLS.
    Redirect permanent / https://family-roots.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName family-roots.example.com
    DocumentRoot /var/www/family-roots/public

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/family-roots.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/family-roots.example.com/privkey.pem
    # Modern defaults; adjust to your certificate chain if needed.
    SSLProtocol             -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/family-roots/public>
        # The app and its .htaccess are outside the web root; rewriting is
        # done here so AllowOverride can stay None (safer).
        AllowOverride None

        Options -Indexes -MultiViews
        Require all granted

        # Front-controller rewrite: real files/directories are served as-is,
        # everything else goes to index.php.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.php [L]

        # Never serve dotfiles (.env is not here, but be defensive).
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Belt and braces: nothing outside public/ should ever be served even if
    # the DocumentRoot is changed by mistake.
    <DirectoryMatch "^/var/www/family-roots/(app|config|database|routes|tests|storage)">
        Require all denied
    </DirectoryMatch>

    # PHP hardening (mod_php). With PHP-FPM set these in the pool instead.
    php_admin_flag  display_errors off
    php_admin_value max_execution_time 30
    php_admin_value memory_limit 128M

    # If HTTPS is terminated by a trusted proxy/load balancer in front of
    # Apache, uncomment so the app sees HTTPS (secure cookies + HSTS):
    # SetEnvIf X-Forwarded-Proto https HTTPS=on

    ErrorLog  /var/log/apache2/family-roots-error.log
    CustomLog /var/log/apache2/family-roots-access.log combined
</VirtualHost>
